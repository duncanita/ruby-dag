name: CI

# push is limited to main so PR branches run once (via pull_request)
# instead of twice; tags still build so releases get a fresh gate.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
          - head
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        id: setup
        continue-on-error: ${{ matrix.ruby == 'head' }}
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # COVERAGE=1 turns on the SimpleCov gate in spec/test_helper.rb so the
      # rake run enforces coverage, not just tests + standardrb.
      - id: test
        if: ${{ steps.setup.outcome == 'success' }}
        run: bundle exec rake
        continue-on-error: ${{ matrix.ruby == 'head' }}
        env:
          COVERAGE: "1"
      - name: Report experimental Ruby failure
        if: ${{ matrix.ruby == 'head' && (steps.setup.outcome == 'failure' || steps.test.outcome == 'failure') }}
        run: echo '::warning::Experimental Ruby head failed; see the setup or test step for details.'
