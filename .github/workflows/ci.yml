name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
          - head
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # COVERAGE=1 turns on the SimpleCov gate in spec/test_helper.rb so the
      # rake run enforces coverage, not just tests + standardrb.
      - run: bundle exec rake
        env:
          COVERAGE: "1"
